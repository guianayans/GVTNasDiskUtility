services:
  gvtnas:
    image: 'node:22'
    container_name: gvtnas
    working_dir: /app
    privileged: true
    volumes:
      - '/pendriver/GVTNas:/app'
      - '/dev:/dev'
      - '/run/udev:/run/udev'
      - '/mnt:/mnt'
      - '/media:/media'
      - '/var/lib/gvtnas-samba:/var/lib/samba'
      - '/etc/gvtnas-samba:/etc/samba'
      - '/pendriver/GVTNas/wireguard/config:/wg-config:ro'
    ports:
      - '3010:3010'
      - '445:445'
      - '139:139'
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      VITE_APP_PASSWORD: ${APP_PASSWORD}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3010
      SAMBA_CONFIG_PATH: /etc/samba/smb.conf
      PUBLIC_SMB_HOST: ${PUBLIC_SMB_HOST}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3010}
      NAS_SMB_PASSWORD: ${NAS_SMB_PASSWORD}
      NAS_SMB_USER: ${NAS_SMB_USER:-nasuser}
      NAS_SMB_GROUP: ${NAS_SMB_GROUP:-nasuser}
      # mesma variável que liga/desliga o serviço "wireguard" abaixo: com 0, a tela de instruções
      # avisa que a VPN embutida está desativada em vez de mostrar QR codes de uma VPN parada
      WIREGUARD_ENABLED: ${WIREGUARD:-1}
    command: >
      bash -c '
        set -e
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y samba samba-common-bin udisks2 ntfs-3g exfatprogs
        useradd -M -s /usr/sbin/nologin ${NAS_SMB_USER:-nasuser} >/dev/null 2>&1 || true
        service smbd start
        # a senha vem do ambiente do container, lida com printenv (sem cifrão: o Coolify mexe em valores
        # com cifrão). Assim ela não fica escrita no comando, que aparece no docker inspect e no ps do servidor
        PASS=`printenv NAS_SMB_PASSWORD || true`
        if [ -z "$$PASS" ]; then echo "defina NAS_SMB_PASSWORD no Coolify (senha do Samba)"; exit 1; fi
        if ! pdbedit -L | grep -q "^${NAS_SMB_USER:-nasuser}:"; then
          printf "%s\n%s\n" "$$PASS" "$$PASS" | smbpasswd -a -s ${NAS_SMB_USER:-nasuser}
        else
          printf "%s\n%s\n" "$$PASS" "$$PASS" | smbpasswd -s ${NAS_SMB_USER:-nasuser}
        fi
        unset PASS
        npm_config_production=false npm ci --no-audit --no-fund
        npm run build --if-present
        npm start
      '
    # o Coolify mostra "Running (healthy)" em vez de "Running (no healthcheck)".
    # start_period longo: a cada subida o container instala pacotes e recompila antes de servir.
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1:3010/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  # VPN embutida (opcional). WIREGUARD=1 (padrão) liga; WIREGUARD=0 desliga: o container sobe mas
  # fica parado, sem iniciar o WireGuard (nada escuta na 51820/udp). Ele continua existindo de
  # propósito: sem container, o Coolify marca o serviço inteiro como "Degraded".
  # Útil para quem já tem outra VPN para chegar na rede. As configurações dos aparelhos ficam
  # guardadas em wireguard/config e voltam ao religar.
  wireguard:
    image: linuxserver/wireguard
    container_name: wireguard
    # sem cifrão de propósito (o Coolify mexe em valores com cifrão): lê a variável com printenv
    entrypoint:
      - /bin/sh
      - -c
      - 'if printenv WIREGUARD | grep -qx 0; then echo "VPN embutida desativada (WIREGUARD=0)"; trap "exit 0" TERM INT; while :; do sleep 3600 & wait; done; fi; exec /init'
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      WIREGUARD: ${WIREGUARD:-1}
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      TZ: ${TZ:-America/Sao_Paulo}
      SERVERURL: ${SERVERURL}
      SERVERPORT: ${SERVERPORT:-51820}
      PEERS: ${PEERS:-iphone,macbook,windows}
      PEERDNS: ${PEERDNS:-1.1.1.1}
      INTERNAL_SUBNET: ${INTERNAL_SUBNET:-10.10.0.0/24}
    volumes:
      - '/pendriver/GVTNas/wireguard/config:/config'
      - '/lib/modules:/lib/modules'
    ports:
      - '51820:51820/udp'
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    # saudável se a VPN está desligada de propósito (WIREGUARD=0) ou se a interface wg0 está no ar
    healthcheck:
      test: ['CMD-SHELL', 'printenv WIREGUARD | grep -qx 0 || wg show wg0 >/dev/null 2>&1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
